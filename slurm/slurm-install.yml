---
- hosts: all
  become: yes
  vars:
    slurm_user: slurm
    slurm_group: slurm

  tasks:
    - name: Update the package repository
      ansible.builtin.apt:
        update_cache: yes

    - name: Ensure required packages are installed (Compute)
      ansible.builtin.apt:
        name:
          - slurm-wlm
          - munge
        state: present
      when: "'master-node' not in inventory_hostname"
    
    - name: Ensure required packages are installed (Control)
      ansible.builtin.apt:
        name:
          - slurm-wlm
          - munge
        state: present
      when: "'master-node' in inventory_hostname"

    # - name: Ensure package 240719
    #   include_tasks: system-package-240719.yml 
    
    # - name: Ensure package 240820
    #   include_tasks: system-package-240820.yml

    # - name: Create Munge Key
    #   include_tasks: create-mungekey-sub.yml 

    
    - name: Distribute configuration files
      include_tasks: distribute-config-files.yml 

    - name: Ensure slurmd service is running
      systemd:
        name: slurmd
        state: restarted
        enabled: yes
      when: "'master-node' not in inventory_hostname"

    - name: Ensure slurmctld service is running on master node
      systemd:
        name: slurmctld
        state: restarted
        enabled: yes
      when: "'master-node' in inventory_hostname"
