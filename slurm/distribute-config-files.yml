- name: Copy Gres files
  copy:
    src: "llmjp_conf/gres.conf"
    dest: "/etc/slurm/gres.conf"
    owner: slurm
    group: slurm
    mode: 644
  when: "'gpu-node' in inventory_hostname"
  ignore_errors: yes


- name: Copy cgroup configuration files
  copy:
    src: "llmjp_conf/cgroup.conf"
    dest: "/etc/slurm/cgroup.conf"

- name: Ensure /var/log/slurm is slurm-rw-able 
  ansible.builtin.file:
    path: "/var/log/slurm"
    state: directory
    owner: slurm
    group: slurm

- name: Backup the remote /etc/hosts file
  ansible.builtin.command:
    cmd: cp /etc/hosts /etc/hosts.backup-{{ ansible_date_time.iso8601 }}
  become: yes
  tags: backup-hosts

- name: Refresh hostfile
  copy:
    src: "llmjp_conf/hosts"
    dest: "/etc/hosts"
    owner: root
    group: root
  when: "'gpu-node' in inventory_hostname"


- name: Set the hostname temporarily
  ansible.builtin.command:
    cmd: hostnamectl set-hostname {{ inventory_hostname }}
  when: "'gpu-node' in inventory_hostname"
    

- name: Update /etc/hostname file
  ansible.builtin.lineinfile:
    path: /etc/hostname
    line: "{{ inventory_hostname }}"
  when: "'gpu-node' in inventory_hostname"




