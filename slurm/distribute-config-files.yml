---    
- name: Copy Slurm configuration files
  copy:
    src: "llmjp_conf/slurm.conf"
    dest: "/etc/slurm/slurm.conf"
    owner: root
    group: root
    # mode: 644

- name: Copy Prolog files
  copy:
    src: "llmjp_conf/prolog.sh"
    dest: "/etc/slurm/prolog.sh"
    owner: slurm
    group: slurm
    mode: 755

- name: Copy Epilog files
  copy:
    src: "llmjp_conf/epilog.sh"
    dest: "/etc/slurm/epilog.sh"
    owner: slurm
    group: slurm
    mode: 755

